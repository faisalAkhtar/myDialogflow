<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta content="width=device-width, initial-scale=1.0" name="viewport">
  <title>Faisal's App</title>
  <link rel="icon" href="/static/img/favicon.ico">
  <link rel="stylesheet" href="/static/css/operator.css">
  <link rel="stylesheet" href="https://use.fontawesome.com/releases/v5.10.1/css/all.css">
  <script src="https://www.gstatic.com/firebasejs/live/3.1/firebase.js"></script>
</head>

<body>
<!--  People  -->
<div class="peopleDiv peopleDivSmall">
  <div class="peopleMsgs">
    <div class="pauseDiv">
      Take a break
      <label class="switch">
        <input type="checkbox" id="pauseButton" onclick="pauseCustomers()">
        <span class="slider round"></span>
      </label>
    </div>
   <div class="peopleMsgz">
      <div class="people noCustomers">
        <text class="peopleName">
          <div class="name">&lt; No customers &gt;</div>
        </text>
      </div>
    </div>
  </div>
  <div class="loggedSignOut" id="logOut">Sign Out</div>
</div>

<!--  Messages  -->
<div id="cover"></div>
<div class="messageDivSmall title-bar">
  <i class="fas fa-arrow-left" onclick="goBack('peopleDiv')"></i>
  <p class="title">User</p>
<!--  <i class="fas fa-ellipsis-v" onclick="openMenu('messageDiv')"></i>  -->
</div>

<div class="messageDivSmall messages">
</div>

<div class="messageDivSmall sendTxt">
  <div style="position:relative;height:100%;">
    <textarea type="text" id="txtMsg" placeholder="Send text..." readonly></textarea>
    <button onclick="sendTxtMsg()" id="sndBtn"><img src="/static/img/send.png"></button>
  </div>
</div>

<!--  Logged Div  -->
<div class="loggedDiv loggedDivSmall">
  <div class="loggedProfile">
    <i class="fas fa-arrow-left" onclick="goBack()"></i>
    <img class="loggedDP">
    <text class="loggedName"></text>
  </div>
  <div class="loggedSignOut" id="logOut">
    <i class="fas fa-sign-out-alt"></i> Sign Out
  </div>
</div>
<script src="/static/js/app-small-handler.js"></script>
<script src="/static/js/app-handler.js"></script>
</body>
</html>
