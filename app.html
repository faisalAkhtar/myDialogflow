<body>
<!--	People	-->
<div class="peopleDiv peopleDivSmall">
	<div class="peopleMsgs">
	</div>
	<div class="loggedSignOut" id="logOut">
		<i class="fas fa-sign-out-alt"></i> Sign Out
	</div>
</div>

<!--	Messages	-->
<div class="messageDivSmall title-bar">
	<i class="fas fa-arrow-left" onclick="goBack('peopleDiv')"></i>
	<div class="dp">
		<img src="img/default.jpg" class="dpImg">
		<span class="online-mark">
			<span class="online"></span>
		</span>
	</div>
	<p class="title">User</p>
<!--	<i class="fas fa-ellipsis-v" onclick="openMenu('messageDiv')"></i>	-->
</div>

<div class="messageDivSmall messages">
</div>

<div class="messageDivSmall sendTxt">
	<div style="position:relative;height:100%;">
		<textarea type="text" id="txtMsg" placeholder="Send text..." readonly></textarea>
		<button onclick="sendTxtMsg()" id="sndBtn"><i class="fas fa-paper-plane"></i></button>
	</div>
</div>

<!--	Logged Div	-->
<div class="loggedDiv loggedDivSmall">
	<div class="loggedProfile">
		<i class="fas fa-arrow-left" onclick="goBack()"></i>
		<img class="loggedDP">
		<text class="loggedName"></text>
	</div>
	<div class="loggedSignOut" id="logOut">
		<i class="fas fa-sign-out-alt"></i> Sign Out
	</div>
</div>
<script src="js/app-small-handler.js"></script>
<script src="js/app-handler.js"></script>
</body>
</html>
